<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empereur, cityen, Esclave | Joueurs </title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="./dist/output.css">
</head>

<body>
    <header class="fixed top-0 left-0 z-50 w-full bg-transparent">
        <div class="relative mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 sm:py-4">

            <!--logo-->
            <a href="#" class="flex items-center gap-2 text-[#422B18]">
                <span class="text-3xl sm:text-4xl"><img src="img/crown.png" alt="crown logo"
                        class="h-8 w-8 object-contain sm:h-10 sm:w-10"></span>
                <span class="font-heading text-base font-semibold sm:text-xl lg:text-2xl">
                    Empereur, Citoyen, Esclave
                </span>
            </a>
            <!-- desktop navigation-->
            <nav class="hidden md:block ">
                <ul class="flex items-center gap-5 font-heading text-base text-[#422B18] lg:gap-8 lg:text-lg">
                    <li><a href="index.html" class="hover:text-[#8B2E22]">Accueil</a></li>
                    <li><a href="players.html" class="hover:text-[#8B2E22]">Joueurs</a></li>
                    <li><a href="game.html" class="hover:text-[#8B2E22] font-semibold text-[#8B2E22]">Jeu</a></li>
                    <li><a href="history.html" class="hover:text-[#8B2E22]">Historique</a></li>
                </ul>
            </nav>
            <!-- mobile Menu -->
            <details class="relative md:hidden">
                <summary class="cursor-pointer list-none rounded-md border-[#8B623D] px-3 py-2 text-2xl text-[#422B18]">
                    ☰
                </summary>
                <nav
                    class="absolute right-0 top-full mt-3 w-48 rounded-lg border border-[#8B623D] bg-[#F1DFBD] p-3 shadow-lg">

                    <ul class="flex flex-col gap-4 font-serif text-base text-[#422B18]">
                        <li><a href="index.html">Accueil</a></li>
                        <li><a href="players.html">Joueurs</a></li>
                        <li><a href="game.html" class="font-semibold text-[#8B2E22]">Jeu</a></li>
                        <li><a href="history.html">Historique</a></li>
                    </ul>

                </nav>
            </details>

        </div>
        <div class="h-[1.5px] mx-auto w-full bg-[#8B623D]"></div>
    </header>

    <main class="mx-auto min-h-screen max-w-7xl px-4 pb-4 pt-20 sm:px-6 lg:h-screen lg:overflow-hidden">

        <div class="grid w-full grid-cols-1 gap-4 lg:h-full lg:grid-cols-4 lg:items-center">
            <!-- Game Information Sidebar -->
            <aside id="game-info" class="order-first flex gap-2 lg:order-last lg:col-span-1 lg:flex-col lg:gap-4">


                <section id="player-info"
                    class="flex flex-1 items-center justify-center gap-2 rounded-xl border border-[#8B623D] bg-[#F1DFBD]/80 p-2 lg:flex-col lg:gap-2 lg:p-4">

                    <!-- Player Avatar -->
                    <img id= "player-avatar" src="./img/Portrait médiéval d’une femme au manteau vert.png" alt="Avatar du joueur"
                        class="h-10 w-10 rounded-full border-2 border-[#8B623D] object-cover sm:h-12 sm:w-12 lg:h-16 lg:w-16">

                    <!-- Player Details -->
                    <div class="min-w-0 text-center">
                        <h3 id="player-name-display" class="truncate font-heading text-sm font-bold text-[#422B18] sm:text-base lg:text-xl">
                            Joueur
                        </h3>

                        <p id="player-camp-display" class="font-body text-xs text-[#8B623D] sm:text-sm">
                            Empereur
                        </p>

                        <p id="player-score-display" class="mt-1 font-heading text-sm font-bold text-[#8B2E22] lg:text-lg">
                            Score : 0
                        </p>
                    </div>
                </section>


                <section id="round-info"
                    class="flex flex-1 flex-col items-center justify-center gap-1 rounded-xl border border-[#8B623D] bg-[#F1DFBD]/80 p-2 text-center lg:gap-2 lg:p-4">

                    <!-- Round Number -->
                    <h3 class="font-heading text-xs font-semibold text-[#8B623D] sm:text-sm lg:text-base">
                        ROUND
                    </h3>

                    <p id="manche-number" class="font-heading text-xl font-bold text-[#8B2E22] sm:text-2xl lg:text-3xl">
                        1
                    </p>

                    <!-- Current Camp -->
                    <div class="h-px w-full bg-[#8B623D]/50"></div>

                    <p id="starting-camp" class="font-body text-xs text-[#422B18] sm:text-sm">
                        Empereur commence
                    </p>

                    <p id="current-camp" class="font-heading text-sm font-bold text-[#422B18] sm:text-base">
                        Empereur
                    </p>

                </section>



                <section id="computer-info"
                    class="flex flex-1 items-center justify-center gap-2 rounded-xl border border-[#8B623D] bg-[#F1DFBD]/80 p-2 lg:flex-col lg:gap-2 lg:p-4">

                    <!-- Computer Avatar -->
                    <img id="computer-avatar" src="./img/Roi médiéval barbu au manteau rouge.png" alt="Avatar de l'ordinateur"
                        class="h-10 w-10 rounded-full border-2 border-[#8B623D] object-cover sm:h-12 sm:w-12 lg:h-16 lg:w-16">

                    <!-- Computer Details -->
                    <div class="min-w-0 text-center">

                        <h3 class="truncate font-heading text-sm font-bold text-[#422B18] sm:text-base lg:text-xl">
                            Ordinateur
                        </h3>

                        <p id="computer-camp-display" class="font-body text-xs text-[#8B623D] sm:text-sm">
                            Esclave
                        </p>

                        <p id="computer-score-display" class="mt-1 font-heading text-sm font-bold text-[#8B2E22] lg:text-lg">
                            Score : 0
                        </p>

                    </div>

                </section>

            </aside>

            <!-- Game Board -->
            <section id="game-board" class="flex min-w-0 flex-col justify-evenly lg:col-span-3 lg:h-full">

                <!-- Opponent Cards -->
                <section id="opponent-cards"
                    class="medieval-card flex items-center justify-center gap-3 rounded-xl p-2 sm:gap-5 sm:p-3 lg:gap-4">
                </section>

                <!-- Battle Area -->
                <section id="battle-area" class="flex flex-col items-center justify-center gap-2 rounded-xl p-2 sm:p-3">

                    <div class="flex w-full items-center justify-around gap-3">

                        <!-- Opponent Card -->
                        <div class="flex flex-col items-center gap-1">
                            <img id="computer-card-image" src="./img/Carte médiévale des citoyens artisans.png" alt="Carte Citoyen"
                                class="w-24 object-contain sm:w-28 hidden">

                            <span id="computer-card-name" class="font-heading text-base font-semibold text-[#422B18]">
                                Citoyen
                            </span>
                        </div>

                        <!-- Tour and VS -->
                        <div class="flex flex-col items-center gap-2">

                            <button id="round-button" type="button"
                                class="rounded-md border border-[#8B623D] bg-transparent px-4 py-1 font-heading text-base font-semibold text-[#422B18]">
                                Tour 1
                            </button>

                            <span class="font-heading text-3xl font-bold text-[#8B2E22] sm:text-4xl">
                                VS
                            </span>

                        </div>

                        <!-- Player Card -->
                        <div class="flex flex-col items-center gap-1">
                            <img id="player-card-image" src="./img/Carte de l’Empereur en style vintage.png" alt="Carte Empereur"
                                class="w-24 object-contain sm:w-28 hidden">

                            <span id="player-card-name" class="font-heading text-base font-semibold text-[#422B18]">
                                Empereur
                            </span>
                        </div>

                    </div>

                    <!-- Battle Result -->
                    <div class="text-center">
                        <p id="battle-result" class="font-heading text-lg font-bold text-[#8B2E22] sm:text-xl">
                            Choisissez une carte pour commencer
                        </p>
                    </div>

                </section>

                <!-- Player Cards -->
                <section id="player-cards"
                    class=" medieval-card flex items-center justify-center gap-2 rounded-xl p-2 sm:gap-4 sm:p-3 lg:gap-4">

                </section>

            </section>


        </div>

    </main>


    <script type="module" src="./src/main.js"></script>
</body>

</html>
